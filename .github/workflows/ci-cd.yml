# CI runs here. CD is Render's job (see render.yaml):
# set the service's Auto-Deploy to "After CI Checks Pass".
name: CI

# When to run: on every PR, and on every push to main.
on:
  pull_request:
  push:
    branches: [main]

# The job may read the code, but not change it.
permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest # a fresh Linux machine each run
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7 # get the code
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7 # install Python
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest
